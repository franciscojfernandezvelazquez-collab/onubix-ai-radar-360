<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizar ONUBIX</title><body style="font:18px system-ui;background:#0c1424;color:white;padding:24px"><h1>Actualizar ONUBIX</h1><p id="status">Eliminando la caché antigua sin tocar tus datos...</p><script>(async()=>{try{const scope=new URL('./',location.href).href;if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())if(r.scope===scope)await r.unregister()}if('caches'in window){for(const k of await caches.keys())if(k.startsWith('onubix-radar:'+scope+':'))await caches.delete(k)}document.getElementById('status').textContent='Actualización preparada. Abriendo aplicación...';location.replace('./index.html?refresh='+Date.now())}catch(e){document.getElementById('status').textContent='Error: '+e.message}})()</script></body></html>
